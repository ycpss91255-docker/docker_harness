name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: bats + shellcheck + hadolint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .claude/test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build test image
        run: ./ci.sh build

      - name: Lint hooks (shellcheck)
        run: ./ci.sh lint

      - name: Lint test Dockerfile (hadolint)
        run: ./ci.sh hadolint

      - name: Run bats specs
        run: ./ci.sh test

      - name: Audit CLAUDE.md `.claude/` tree drift
        run: ./ci.sh tree-check
